name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire selector appended to the Test step (e.g. -Dtest=FooTest -Dsurefire.failIfNoSpecifiedTests=false)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    permissions:
      actions: write  # for styfle/cancel-workflow-action to cancel/stop running workflows
      contents: read  # for actions/checkout to fetch code
    name: "${{ matrix.root-pom }} on JDK ${{ matrix.java }} on ${{ matrix.os }}"
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java: [ 8, 11, 17, 21 ]
        root-pom: [ 'pom.xml', 'android/pom.xml' ]
        include:
          - os: windows-latest
            java: 21
            root-pom: pom.xml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      ROOT_POM: ${{ matrix.root-pom }}
    steps:
      # Cancel any previous runs for the same branch that are still running.
      - name: 'Cancel previous runs'
        uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa # 0.12.1
        with:
          access_token: ${{ github.token }}
      - name: 'Check out repository'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # When we specify multiple JDKs, the final one becomes the default, which is used to execute Maven itself.
      # Our Maven configuration then specifies different JDKs to use for some of the steps:
      # - 11 (sometimes) to *download* to support anyone who runs JDiff or our Gradle integration tests (including our doc snapshots and our Java 11 CI test run) but not to use directly
      # - 24 for running Javadoc and javac (to help people who build Guava locally and might not use a recent JDK to run Maven)
      - name: 'Set up JDKs'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: |
            ${{ matrix.java }}
            24
          distribution: 'temurin'
          cache: 'maven'
      - name: 'Install'
        shell: bash
        run: ./mvnw -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dtoolchain.skip install -U -DskipTests=true -f $ROOT_POM
      - name: 'Test'
        shell: bash
        run: ./mvnw -B -P!standard-with-extra-repos -Dtoolchain.skip verify -U -Dmaven.javadoc.skip=true -Dsurefire.toolchain.version=${{ matrix.java }} -f $ROOT_POM ${{ inputs.test-filter }}
      - name: 'Print skipped tests with reasons'
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          from collections import Counter
          srcs = glob.glob('guava-tests/test/**/*.java', recursive=True) + glob.glob('android/guava-tests/test/**/*.java', recursive=True)
          cache = {}
          def explain(cls, name, sk):
              # Resolve an assumption skip with no descriptive message to the assume() line that raised it.
              text = sk.text or ''
              for m in re.finditer(r'\((\w+\.java):(\d+)\)', text):
                  for f in srcs:
                      if f.endswith('/' + m.group(1)):
                          line = open(f, encoding='utf-8').read().splitlines()[int(m.group(2)) - 1].strip()
                          if 'assum' in line:
                              return '%s:%s %s' % (m.group(1), m.group(2), line)
              meth = name.split('[')[0]
              pkg = cls.rsplit('.', 1)[0].replace('.', '/')
              if meth not in cache:
                  found = []
                  for f in srcs:
                      if '/' + pkg + '/' not in f:
                          continue
                      lines = open(f, encoding='utf-8').read().splitlines()
                      for i, l in enumerate(lines):
                          if re.search(r'void ' + re.escape(meth) + r'\(', l):
                              for j in range(i + 1, min(i + 8, len(lines))):
                                  if 'assume()' in lines[j]:
                                      found.append('%s:%d %s' % (f.rsplit('/', 1)[1], j + 1, lines[j].strip()))
                  cache[meth] = '; '.join(sorted(set(found)))
              return cache[meth]
          reasons = Counter()
          total = 0
          for f in sorted(glob.glob('android/*/target/surefire-reports/TEST-*.xml') + glob.glob('*/target/surefire-reports/TEST-*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is not None:
                      total += 1
                      msg = (sk.get('message') or (sk.text or '').strip() or 'no message').splitlines()[0][:200]
                      if 'value of' not in msg:
                          where = explain(tc.get('classname'), tc.get('name'), sk)
                          if where:
                              msg = '%s (assumption raised by %s)' % (msg, where)
                      print('SKIPPED %s.%s: %s' % (tc.get('classname'), tc.get('name'), msg))
                      reasons[msg] += 1
          print('Total skipped: %d (each SKIPPED line names the assumption that skipped it)' % total)
          for m, c in reasons.most_common():
              print('  %6d x %s' % (c, m))
          PY
      - name: 'Upload guava jar'
        if: matrix.os == 'ubuntu-latest' && matrix.java == 11 && matrix.root-pom == 'pom.xml'
        uses: actions/upload-artifact@v4
        with:
          name: guava-jar
          path: guava/target/guava-*-jre.jar
          if-no-files-found: error
      - name: 'Print Surefire reports'
        # Note: Normally a step won't run if the job has failed, but this causes it to
        if: ${{ failure() }}
        shell: bash
        run: ./util/print_surefire_reports.sh
      - name: 'Integration Test'
        if: matrix.java == 11
        shell: bash
        run: util/gradle_integration_tests.sh

  publish_snapshot:
    name: 'Publish snapshot'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 'Set up JDKs'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          # For discussion, see the first setup-java block.
          # The publish-snapshot workflow doesn't run tests, so we don't have to care which version Maven would select for that step.
          java-version: 24
          distribution: 'temurin'
          server-id: sonatype-nexus-snapshots
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          cache: 'maven'
      - name: 'Publish'
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
        run: ./util/deploy_snapshot.sh

  generate_docs:
    permissions:
      contents: write
    name: 'Generate latest docs'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 'Set up JDKs'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          # For discussion, see the first setup-java block.
          # The generate-docs workflow doesn't run tests, so we don't have to care which version Maven would select for that step.
          # But we need Java 11 for JDiff.
          java-version: |
            11
            24
          distribution: 'temurin'
          cache: 'maven'
      - name: 'Generate latest docs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./util/update_snapshot_docs.sh
